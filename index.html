
<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OS – Online učionica</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f2f6fc;
  text-align: center;
  padding: 40px 15px;
  color: #26364a;
}
.container {
  max-width: 850px;
  margin: auto;
}
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
  gap: 20px;
  margin-top: 35px;
}
.card {
  background: white;
  padding: 35px 20px;
  border-radius: 18px;
  text-decoration: none;
  color: #26364a;
  box-shadow: 0 4px 15px #0001;
  transition: transform .2s;
}
.card:hover {
  transform: translateY(-5px);
}
.icon { font-size: 50px; }
h1 { color: #2457a7; }
h2 { margin-bottom: 8px; }
</style>
</head>
<body>
<div class="container">
  <h1>OS – Online učionica</h1>
  <p>Odaberi predmet i započni vježbanje!</p>

  <div class="cards">
    <a class="card" href="./hrvatski/">
      <div class="icon">📚</div>
      <h2>Hrvatski jezik</h2>
      Vježbe i testovi
    </a>

    <a class="card" href="./njemacki/">
      <div class="icon">🇩🇪</div>
      <h2>Njemački jezik</h2>
      Vježbe i testovi
    </a>

    <a class="card" href="./matematika/">
      <div class="icon">➗</div>
      <h2>Matematika</h2>
      Vježbe i testovi
    </a>
  </div>
</div>
</body>
</html>
